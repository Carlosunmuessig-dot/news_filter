<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carlos HQ - News</title>
    
    <style>
        /* =========================================
           1. APPLE FARBPALETTE & VARIABLEN
           ========================================= */
        :root {
            --apple-bg: #f5f5f7;          /* Original Apple Light Background */
            --apple-card: #ffffff;        /* Original Apple Card White */
            --apple-text: #1d1d1f;        /* Original Apple Dark Text */
            --apple-text-muted: #86868b;  /* Original Apple Subtitle Gray */
            --apple-nav-bg: rgba(245, 245, 247, 0.72); /* Transparenz für Nav */
        }

        /* =========================================
           2. GLOBALES SETUP & TYPOGRAFIE
           ========================================= */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Verstecke Scrollbars im Mac-Style */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        * { box-sizing: border-box; }

        /* =========================================
           3. INTRO SCREEN (Schwarzes Design)
           ========================================= */
        #intro-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .intro-title {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* =========================================
           4. TOP NAVIGATION (Blur-Effekt)
           ========================================= */
        .apple-navbar {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 48px;
            background-color: var(--apple-nav-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .apple-nav-list {
            display: flex;
            gap: 32px;
            list-style: none;
            margin: 0;
            padding: 0 20px;
            overflow-x: auto;
            max-width: 1000px;
            width: 100%;
        }
        /* Mobile horizontal scroll ohne Scrollbar */
        .apple-nav-list::-webkit-scrollbar { display: none; }
        
        .apple-nav-item {
            color: var(--apple-text);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: -0.01em;
            opacity: 0.7;
            cursor: pointer;
            transition: opacity 0.2s, font-weight 0.2s;
            white-space: nowrap;
            padding: 16px 0;
        }
        .apple-nav-item:hover, .apple-nav-item.active {
            opacity: 1;
            font-weight: 600;
        }

        /* =========================================
           5. LAYOUT & WHITESPACE
           ========================================= */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 40px 80px 40px; /* Viel Platz nach oben für Nav */
        }
        .page-title {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        /* Unterkategorien (Chips) */
        .sub-nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .chip {
            background-color: transparent;
            border: 1px solid #d2d2d7;
            color: var(--apple-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { border-color: var(--apple-text); }
        .chip.active {
            background-color: var(--apple-text);
            color: var(--apple-card);
            border-color: var(--apple-text);
        }

        /* =========================================
           6. BENTO GRID (Produktkarten)
           ========================================= */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        /* Die Apple-Karte: Radius exakt 18px */
        .bento-card {
            background-color: var(--apple-card);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .bento-card:hover {
            transform: scale(1.015);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        /* Hero Karte (Großes Bild) */
        .bento-hero {
            grid-column: 1 / -1;
            flex-direction: row;
            min-height: 420px;
        }

        /* =========================================
           7. KARTEN INHALTE
           ========================================= */
        .card-img-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
        }
        .bento-hero .card-img-wrapper {
            width: 60%;
            height: auto;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 32px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .bento-hero .card-content {
            width: 40%;
            justify-content: center;
        }

        .card-kicker {
            font-size: 12px;
            font-weight: 600;
            color: var(--apple-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }
        .card-headline {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 12px;
            margin-top: 0;
            letter-spacing: -0.01em;
        }
        .bento-hero .card-headline {
            font-size: 34px;
            letter-spacing: -0.02em;
        }
        .card-text {
            font-size: 15px;
            color: var(--apple-text-muted);
            line-height: 1.5;
            flex-grow: 1;
            margin: 0;
        }
        .bento-hero .card-text { font-size: 17px; }
        
        .card-source {
            font-size: 12px;
            color: var(--apple-text-muted);
            margin-top: 20px;
            font-weight: 500;
        }

        /* Text abschneiden */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* =========================================
           8. RESPONSIVE DESIGN (Handy / Tablet)
           ========================================= */
        @media (max-width: 900px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .bento-hero { flex-direction: column; }
            .bento-hero .card-img-wrapper { width: 100%; height: 300px; }
            .bento-hero .card-content { width: 100%; }
            .page-title { font-size: 36px; }
        }
        @media (max-width: 600px) {
            .bento-grid { grid-template-columns: 1fr; }
            .main-container { padding: 80px 20px 40px 20px; }
            .card-content { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- 1. INTRO SCREEN (Tiefschwarz) -->
    <div id="intro-screen">
        <h1 class="intro-title">Carlos HQ</h1>
    </div>

    <!-- 2. TOP NAVIGATION (Apple Store Style) -->
    <nav class="apple-navbar">
        <ul class="apple-nav-list" id="main-nav">
            <!-- Kategorien werden hier per JS eingefügt -->
        </ul>
    </nav>

    <!-- 3. MAIN DASHBOARD -->
    <main class="main-container">
        
        <!-- Titel der aktuellen Kategorie -->
        <h1 class="page-title" id="page-title">Top Stories.</h1>
        
        <!-- Sub-Sektoren (Chips) -->
        <div class="sub-nav" id="sub-sector-filters">
            <!-- Chips werden hier eingefügt -->
        </div>
        
        <!-- News Raster (Bento Grid) -->
        <div class="bento-grid" id="news-grid">
            <!-- Artikel (Ladebildschirm) -->
            <p style="color: var(--apple-text-muted); grid-column: 1/-1; text-align: center;">Nachrichten werden geladen...</p>
        </div>
    </main>

    <!-- 4. JAVASCRIPT LOGIK -->
    <script>
        let allNews = [];
        let activeCategory = 'Alle';
        let activeSubSector = 'Alle';

        // Intro Animation nach dem Laden
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.visibility = 'hidden';
                }, 800);
            }, 1000);
        });

        // Daten holen
        async function fetchNews() {
            try {
                const response = await fetch('nachrichten.json?t=' + new Date().getTime()); 
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allNews = data;
                } else if (data.nachrichten) {
                    allNews = data.nachrichten;
                } else if (data.Nachrichten) {
                    allNews = data.Nachrichten;
                }
                
                renderNavbar();
                renderSubSektors();
                renderNews();
            } catch (error) {
                document.getElementById('news-grid').innerHTML = `<p style="color: var(--apple-text-muted); grid-column: 1/-1;">Verbindung fehlgeschlagen...</p>`;
            }
        }

        // Top Navigation generieren
        function renderNavbar() {
            const nav = document.getElementById('main-nav');
            
            // Standard Kategorien, die in der Navbar sein sollen (wie Apple Produkte)
            const categories = ['Alle', 'Wirtschaft', 'Technologie & Wissenschaft', 'Politik', 'Weltweite Schlagzeilen', 'Lokales & Regionales', 'Kultur & Gesellschaft', 'Sport'];
            
            nav.innerHTML = categories.map(cat => {
                const isActive = activeCategory === cat;
                const displayName = cat === 'Alle' ? 'Übersicht' : cat;
                
                return `
                <li class="apple-nav-item ${isActive ? 'active' : ''}" onclick="setCategory('${cat}')">
                    ${displayName}
                </li>`;
            }).join('');
        }

        // Kategorie wechseln
        function setCategory(cat) {
            activeCategory = cat;
            activeSubSector = 'Alle'; 
            
            const title = cat === 'Alle' ? 'Top Stories.' : cat + '.';
            document.getElementById('page-title').innerText = title;
            
            renderNavbar();
            renderSubSektors();
            renderNews();
            
            // Ganz nach oben scrollen beim Wechsel
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Sub-Sektor (Chip) wechseln
        function setSubSector(sub) {
            activeSubSector = sub;
            renderSubSektors();
            renderNews();
        }

        // Sub-Sektoren Chips generieren
        function renderSubSektors() {
            const container = document.getElementById('sub-sector-filters');
            
            // Wenn wir in "Alle" sind, keine Unterkategorien anzeigen
            if (activeCategory === 'Alle') {
                container.innerHTML = '';
                return;
            }

            const currentArticles = allNews.filter(item => item.hauptkategorie === activeCategory);
            const subSektors = ['Alle', ...new Set(currentArticles.map(item => item.sub_sektor || 'Allgemein'))];

            if (subSektors.length <= 2) {
                container.innerHTML = ''; 
                return;
            }

            container.innerHTML = subSektors.map(sub => {
                const isActive = activeSubSector === sub;
                return `
                <button onclick="setSubSector('${sub}')" class="chip ${isActive ? 'active' : ''}">
                    ${sub}
                </button>
            `}).join('');
        }

        // News Raster rendern
        function renderNews() {
            const grid = document.getElementById('news-grid');
            let filtered = activeCategory === 'Alle' ? allNews : allNews.filter(item => item.hauptkategorie === activeCategory);
            
            if (activeSubSector !== 'Alle') {
                filtered = filtered.filter(item => (item.sub_sektor || 'Allgemein') === activeSubSector);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: var(--apple-text-muted); grid-column: 1/-1;">Es gibt derzeit keine neuen Meldungen in diesem Bereich.</p>`;
                return;
            }

            grid.innerHTML = filtered.map((item, index) => {
                const isHero = index === 0 && activeSubSector === 'Alle';
                
                // Bild-Container (Wird nur erstellt, wenn ein Bild existiert)
                const bildHtml = item.bild && item.bild !== "" 
                    ? `<div class="card-img-wrapper"><img src="${item.bild}" class="card-img" alt="Hero"></div>` 
                    : '';

                // Quelle ermitteln
                let sourceName = 'Online-Quelle';
                if(item.quelle) {
                    if (item.quelle.includes('heise')) sourceName = 'Heise';
                    else if (item.quelle.includes('golem')) sourceName = 'Golem';
                    else if (item.quelle.includes('t3n')) sourceName = 't3n';
                    else if (item.quelle.includes('manager-magazin')) sourceName = 'Manager Magazin';
                    else if (item.quelle.includes('handelsblatt')) sourceName = 'Handelsblatt';
                    else if (item.quelle.includes('zeit')) sourceName = 'Die Zeit';
                    else if (item.quelle.includes('spiegel')) sourceName = 'Der Spiegel';
                }

                return `
                <a href="${item.quelle}" target="_blank" class="bento-card ${isHero ? 'bento-hero' : ''}">
                    ${bildHtml}
                    <div class="card-content">
                        <span class="card-kicker">${item.sub_sektor || 'News'}</span>
                        <h3 class="card-headline ${isHero ? '' : 'line-clamp-2'}">${item.titel || 'Kein Titel'}</h3>
                        <p class="card-text ${isHero ? '' : 'line-clamp-3'}">${item.text || 'Kein Inhalt verfügbar.'}</p>
                        <span class="card-source">${sourceName}</span>
                    </div>
                </a>
            `;
            }).join('');
        }

        window.onload = fetchNews;
        setInterval(fetchNews, 300000); 
    </script>
</body>
</html>
