<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carlos HQ - News</title>
    
    <style>
        /* =========================================
           1. APPLE FARBPALETTE & VARIABLEN
           ========================================= */
        :root {
            --apple-bg: #f5f5f7;          
            --apple-card: #ffffff;        
            --apple-text: #1d1d1f;        
            --apple-text-muted: #86868b;  
            --apple-nav-bg: rgba(0, 0, 0, 0.85); /* Tiefschwarzes Glas für mehr Kontrast */
        }

        /* =========================================
           2. GLOBALES SETUP 
           ========================================= */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        * { box-sizing: border-box; }

        /* =========================================
           3. INTRO SCREEN & ANIMATIONEN
           ========================================= */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; color: #fff;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .intro-title { font-size: 3rem; font-weight: 600; letter-spacing: -0.02em; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           4. LIVE TICKER (Für Bewegung & Dynamik)
           ========================================= */
        .live-ticker {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 32px;
            background-color: #000; color: #fff;
            z-index: 1001;
            display: flex; align-items: center;
            overflow: hidden;
            font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .ticker-track {
            display: flex; white-space: nowrap;
            animation: ticker 40s linear infinite;
        }
        .ticker-item { margin-right: 40px; }
        .ticker-item span { color: #86868b; margin-right: 8px; }
        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* =========================================
           5. TOP NAVIGATION (Black Glass)
           ========================================= */
        .apple-navbar {
            position: fixed;
            top: 32px; /* Unter dem Ticker */
            left: 0; width: 100%; height: 52px;
            background-color: var(--apple-nav-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .apple-nav-list {
            display: flex; gap: 32px; list-style: none; margin: 0; padding: 0 20px;
            overflow-x: auto; max-width: 1000px; width: 100%;
        }
        .apple-nav-list::-webkit-scrollbar { display: none; }
        .apple-nav-item {
            color: #fff; font-size: 12px; font-weight: 400; letter-spacing: -0.01em;
            opacity: 0.6; cursor: pointer; transition: opacity 0.2s, font-weight 0.2s;
            white-space: nowrap; padding: 16px 0;
        }
        .apple-nav-item:hover, .apple-nav-item.active { opacity: 1; font-weight: 600; }

        /* =========================================
           6. LAYOUT
           ========================================= */
        .main-container {
            max-width: 1200px; margin: 0 auto;
            padding: 130px 40px 80px 40px; 
        }
        .page-title {
            font-size: 48px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 20px;
        }
        .sub-nav { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; }
        .chip {
            background-color: transparent; border: 1px solid #d2d2d7; color: var(--apple-text);
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
        }
        .chip:hover { border-color: var(--apple-text); }
        .chip.active { background-color: var(--apple-text); color: var(--apple-card); border-color: var(--apple-text); }

        /* =========================================
           7. BENTO GRID & KARTEN
           ========================================= */
        .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

        .bento-card {
            background-color: var(--apple-card); border-radius: 22px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            cursor: pointer; text-decoration: none; color: inherit;
            animation: fadeInUp 0.6s backwards;
        }
        .bento-card:hover {
            transform: scale(1.02); box-shadow: 0 14px 44px rgba(0, 0, 0, 0.1);
        }

        /* Die Hero-Karte: Tiefschwarz für extremen Kontrast */
        .bento-hero {
            grid-column: 1 / -1; flex-direction: row; min-height: 420px;
            background-color: #000; color: #fff;
        }
        
        .card-img-wrapper { width: 100%; height: 220px; overflow: hidden; }
        .bento-hero .card-img-wrapper { width: 60%; height: auto; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }

        .card-content { padding: 32px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .bento-hero .card-content { width: 40%; justify-content: center; }

        .card-kicker {
            font-size: 11px; font-weight: 700; color: #0066cc; /* Apple Blau */
            text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
        }
        .bento-hero .card-kicker { color: #2997ff; }

        .card-headline {
            font-size: 20px; font-weight: 600; line-height: 1.25; margin-bottom: 12px; margin-top: 0; letter-spacing: -0.01em;
        }
        .bento-hero .card-headline { font-size: 34px; letter-spacing: -0.02em; }
        
        .card-text { font-size: 15px; color: var(--apple-text-muted); line-height: 1.5; margin: 0; }
        .bento-hero .card-text { font-size: 17px; color: #a1a1a6; }
        
        .card-source { font-size: 12px; color: var(--apple-text-muted); margin-top: 20px; font-weight: 500; }
        .bento-hero .card-source { color: #6e6e73; }

       .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        @media (max-width: 900px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .bento-hero { flex-direction: column; }
            .bento-hero .card-img-wrapper { width: 100%; height: 300px; }
            .bento-hero .card-content { width: 100%; }
        }
        @media (max-width: 600px) {
            .bento-grid { grid-template-columns: 1fr; }
            .main-container { padding: 110px 20px 40px 20px; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1 class="intro-title">Carlos HQ</h1>
    </div>

    <!-- Neuer Live-Ticker -->
    <div class="live-ticker">
        <div class="ticker-track" id="ticker-content">
            <!-- Wird per JS gefüllt -->
        </div>
    </div>

    <!-- Schwarze Navigation -->
    <nav class="apple-navbar">
        <ul class="apple-nav-list" id="main-nav"></ul>
    </nav>

    <main class="main-container">
        <h1 class="page-title" id="page-title">Top Stories.</h1>
        <div class="sub-nav" id="sub-sector-filters"></div>
        <div class="bento-grid" id="news-grid"></div>
    </main>

    <script>
        let allNews = [];
        let activeCategory = 'Alle';
        let activeSubSector = 'Alle';

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.style.opacity = '0';
                setTimeout(() => intro.style.visibility = 'hidden', 800);
            }, 800);
        });

        async function fetchNews() {
            try {
                const response = await fetch('nachrichten.json?t=' + new Date().getTime()); 
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allNews = data;
                } else if (data.nachrichten) {
                    allNews = data.nachrichten;
                }
                
                renderNavbar();
                renderSubSektors();
                renderNews();
                renderTicker();
            } catch (error) {
                console.error("Fehler beim Laden.");
            }
        }

        function renderTicker() {
            const ticker = document.getElementById('ticker-content');
            if (allNews.length === 0) return;
            
            // Nimmt die letzten 5 Schlagzeilen für den Ticker
            const tickerItems = allNews.slice(0, 5).map(item => 
                `<div class="ticker-item"><span>LIVE / ${item.sub_sektor || 'NEWS'}</span> ${item.titel}</div>`
            ).join('');
            
            // Inhalt duplizieren für flüssigen Loop
            ticker.innerHTML = tickerItems + tickerItems + tickerItems;
        }

        function renderNavbar() {
            const nav = document.getElementById('main-nav');
            const categories = ['Alle', 'Wirtschaft', 'Technologie & Wissenschaft', 'Politik', 'Weltweite Schlagzeilen', 'Lokales & Regionales', 'Kultur & Gesellschaft', 'Sport'];
            
            nav.innerHTML = categories.map(cat => {
                const isActive = activeCategory === cat;
                const displayName = cat === 'Alle' ? 'Übersicht' : cat;
                return `<li class="apple-nav-item ${isActive ? 'active' : ''}" onclick="setCategory('${cat}')">${displayName}</li>`;
            }).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            activeSubSector = 'Alle'; 
            document.getElementById('page-title').innerText = cat === 'Alle' ? 'Top Stories.' : cat + '.';
            renderNavbar(); renderSubSektors(); renderNews();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setSubSector(sub) {
            activeSubSector = sub; renderSubSektors(); renderNews();
        }

        function renderSubSektors() {
            const container = document.getElementById('sub-sector-filters');
            if (activeCategory === 'Alle') { container.innerHTML = ''; return; }
            const currentArticles = allNews.filter(item => item.hauptkategorie === activeCategory);
            const subSektors = ['Alle', ...new Set(currentArticles.map(item => item.sub_sektor || 'Allgemein'))];
            if (subSektors.length <= 2) { container.innerHTML = ''; return; }

            container.innerHTML = subSektors.map(sub => {
                const isActive = activeSubSector === sub;
                return `<button onclick="setSubSector('${sub}')" class="chip ${isActive ? 'active' : ''}">${sub}</button>`;
            }).join('');
        }

        function renderNews() {
            const grid = document.getElementById('news-grid');
            let filtered = activeCategory === 'Alle' ? allNews : allNews.filter(item => item.hauptkategorie === activeCategory);
            if (activeSubSector !== 'Alle') {
                filtered = filtered.filter(item => (item.sub_sektor || 'Allgemein') === activeSubSector);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: var(--apple-text-muted); grid-column: 1/-1;">Keine neuen Meldungen.</p>`;
                return;
            }

            grid.innerHTML = filtered.map((item, index) => {
                const isHero = index === 0 && activeSubSector === 'Alle';
                const bildHtml = item.bild && item.bild !== "" 
                    ? `<div class="card-img-wrapper"><img src="${item.bild}" class="card-img" alt="Hero"></div>` : '';
                
                // Ein leichter Zeitversatz für die Animation der normalen Karten
                const animationDelay = isHero ? '0s' : `${(index % 10) * 0.1}s`;

                let sourceName = 'Online-Quelle';
                if(item.quelle) {
                    if (item.quelle.includes('heise')) sourceName = 'Heise';
                    else if (item.quelle.includes('golem')) sourceName = 'Golem';
                    else if (item.quelle.includes('t3n')) sourceName = 't3n';
                    else if (item.quelle.includes('manager-magazin')) sourceName = 'Manager Magazin';
                    else if (item.quelle.includes('handelsblatt')) sourceName = 'Handelsblatt';
                }

                return `
                <a href="${item.quelle}" target="_blank" class="bento-card ${isHero ? 'bento-hero' : ''}" style="animation-delay: ${animationDelay};">
                    ${bildHtml}
                    <div class="card-content">
                        <div>
                            <span class="card-kicker">${item.sub_sektor || 'News'}</span>
                            <h3 class="card-headline ${isHero ? '' : 'line-clamp-2'}">${item.titel || 'Kein Titel'}</h3>
                            <p class="card-text ${isHero ? '' : 'line-clamp-3'}">${item.text || 'Kein Inhalt verfügbar.'}</p>
                        </div>
                        <span class="card-source">${sourceName}</span>
                    </div>
                </a>
            `;
            }).join('');
        }

        window.onload = fetchNews;
        setInterval(fetchNews, 300000); 
    </script>
</body>
</html>
